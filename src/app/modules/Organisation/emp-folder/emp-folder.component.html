    <div class="row">
        <!-- 👥 LEFT COLUMN: Employee List -->
        <div class="col-lg-3 col-md-4 col-sm-12 border-end">
            <div class="list-group">
                <h5 class="mb-3">Employee List</h5>
                <div class="input-group">
                    <input type="text" class="form-control" placeholder="Search employee by name..." [(ngModel)]="searchTerm"
                        (input)="filterEmployees()" />
                    <button class="btn btn-primary" type="button" (click)="filterEmployees()">
                        <i class="bi bi-search"></i>
                    </button>
                </div>
                <button *ngFor="let emp of filteredEmployees" class="list-group-item list-group-item-action"
                    [class.active]="selectedEmployee?.id === emp.id" (click)="onSelectEmployee(emp)">
                    {{ emp.full_Name }}
                </button>
            </div>
        </div>

        <!-- 📄 RIGHT COLUMN: Employee Documents -->
        <div class="col-lg-9">
            <div *ngIf="selectedEmployee">
                <h5 class="mb-3">Documents of {{ selectedEmployee.full_Name }}</h5>

                <div class="row gy-4 d-flex flex-row">
                    <!-- ➕ Add New Document Card -->
                    <div class="col-lg-4 col-md-6 col-sm-12">
                        <div class="card shadow-sm">
                            <div class="card-header d-flex justify-content-between align-items-center">
                                <span>Add Document</span>
                            </div>
                            <div class="card-body d-flex justify-content-center align-items-center"
                                style="height: 190px;">
                                <i class="fa fa-plus fs-3" style="cursor: pointer;"></i>
                            </div>
                        </div>
                    </div>

                    <!-- 📂 Document Cards -->
                    <div class="col-lg-4 col-md-6 col-sm-12" *ngFor="let doc of filteredDocuments">
                        <div class="card shadow-sm">
                            <div
                                class="card-header d-flex justify-content-between align-items-center bg-primary text-white">
                                <span>{{ doc.title || doc.name || doc.class }}</span>
                            </div>
                            <div class="card-body">
                                <div class="d-flex flex-wrap gap-3 justify-content-center" style="cursor: pointer;">
                                    <div (click)="openPreview(doc)" class="text-center" style="width: 130px;">
                                        <img *ngIf="isImage(doc.path || doc.document_Path)"
                                            [src]="'https://payrolladmin.nginfosolutions.com' + (doc.path || doc.document_Path)"
                                            class="img-thumbnail" width="120" height="120" />
                                        <img *ngIf="!isImage(doc.path || doc.document_Path)"
                                            src="assets/img/animate_icons/gallary.png" class="img-thumbnail" width="120"
                                            height="120" />
                                    </div>
                                </div>
                            </div>
                            <div class="card-footer small text-muted d-flex justify-content-between">
                                <span><strong>Updated on:</strong> —</span>
                                <span><strong>Updated by:</strong> —</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div *ngIf="!selectedEmployee" class="text-center mt-5 text-muted">
                <p>Select an employee to view details</p>
            </div>
        </div>
    </div>
</div>
